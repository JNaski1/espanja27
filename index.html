<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Espanja 2027 – Kirjautuminen</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f4f5f7;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: #20252d;
    padding: 20px;
}

.login-card {
    background: white;
    width: 100%;
    max-width: 390px;
    padding: 40px 35px;
    border-radius: 16px;
    border: 1px solid #e5e7eb;
    text-align: center;
}

.icon {
    width: 55px;
    height: 55px;
    background: #eff6ff;
    color: #2563eb;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 24px;
    font-size: 25px;
}

.eyebrow {
    color: #2563eb;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
}

h1 {
    font-size: 25px;
    margin: 10px 0;
}

.subtitle {
    font-size: 13px;
    color: #737b87;
    margin-bottom: 30px;
    line-height: 1.6;
}

input {
    width: 100%;
    padding: 15px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 20px;
    text-align: center;
    letter-spacing: 8px;
    outline: none;
    margin-bottom: 15px;
}

input:focus {
    border-color: #2563eb;
    box-shadow: 0 0 0 3px #dbeafe;
}

button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 8px;
    background: #2563eb;
    color: white;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
}

button:hover {
    background: #1d4ed8;
}

.error {
    color: #dc2626;
    font-size: 12px;
    margin-top: 15px;
    display: none;
}

.footer {
    color: #9ca3af;
    font-size: 11px;
    margin-top: 30px;
}
</style>
</head>

<body>

<div class="login-card">

    <div class="icon">✈</div>

    <div class="eyebrow">Projektisuunnitelma · 2027</div>

    <h1>Espanjan-matka</h1>

    <div class="subtitle">
        Kirjaudu sisään nähdäksesi projektin
        aikataulun ja tehtävälistan.
    </div>

    <form id="loginForm">
        <input
            type="password"
            id="password"
            placeholder="••••"
            maxlength="4"
            inputmode="numeric"
            autocomplete="off"
            autofocus
            required
        >

        <button type="submit">Kirjaudu sisään</button>

        <div class="error" id="error">
            Väärä salasana. Yritä uudelleen.
        </div>
    </form>

    <div class="footer">
        ESPANJA 2027 · YKSITYINEN PROJEKTI
    </div>

</div>

<script>
const PASSWORD = "1306";

document.getElementById("loginForm").addEventListener(
    "submit",
    function(event) {
        event.preventDefault();

        const enteredPassword =
            document.getElementById("password").value;

        if (enteredPassword === PASSWORD) {
            sessionStorage.setItem("espanja_logged_in", "true");
            window.location.href = "roadmap.html";
        } else {
            document.getElementById("error").style.display = "block";
            document.getElementById("password").value = "";
            document.getElementById("password").focus();
        }
    }
);
</script>

</body>
</html>
